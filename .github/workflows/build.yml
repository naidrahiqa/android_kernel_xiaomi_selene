name: Build Selene Kernel

on:
  push:
    branches: [selene-r-oss-update, m1-cherrypick, phrolova]
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: '0'
        type: choice
        options:
          - '0 — Nightly'
          - '1 — Stable'
          - '2 — Hotfix'
      base_version:
        description: 'Base version (e.g. 0.1.0, 0.2.0, 1.0.0)'
        required: false
        default: '0.9.3'
        type: string

env:
  PHROLOVA_VARIANT: ${{ inputs.variant || '0' }}
  PHROLOVA_BASE: ${{ inputs.base_version || '0.9.6' }}
  TOOLCHAIN_NAME: "Greenforce Clang 24.0.0"
  KERNELSU_VERSION: "auto (from resukisu/kernel/Kbuild)"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.PHROLOVA_VERSION }}
      tag: ${{ steps.version.outputs.PHROLOVA_TAG }}
      status: ${{ steps.final-check.outputs.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "Phrolova CI"
          git config user.email "phrolova@users.noreply.github.com"

      - name: Generate version
        id: version
        run: |
          source .github/scripts/version.sh "${{ env.PHROLOVA_VARIANT }}" "${{ env.PHROLOVA_BASE }}"
          echo "PHROLOVA_VERSION=${PHROLOVA_VERSION}" >> $GITHUB_OUTPUT
          echo "PHROLOVA_TAG=${PHROLOVA_TAG}" >> $GITHUB_OUTPUT
          echo "version=${PHROLOVA_VERSION}" >> $GITHUB_ENV
          echo "tag=${PHROLOVA_TAG}" >> $GITHUB_ENV

      - name: Extract ReSukiSU info
        id: ksu
        run: |
          source .github/scripts/get_ksu_info.sh
          echo "KSU_VERSION_NUM=${KSU_VERSION_NUM}" >> $GITHUB_OUTPUT
          echo "KSU_TAG=${KSU_TAG}" >> $GITHUB_OUTPUT
          echo "KSU_COMMIT=${KSU_COMMIT}" >> $GITHUB_OUTPUT
          echo "KSU_BRANCH=${KSU_BRANCH}" >> $GITHUB_OUTPUT

      - name: Notify start
        run: |
          bash .github/scripts/notify-telegram.sh \
            start \
            "${{ steps.version.outputs.PHROLOVA_VERSION }}" \
            "${{ steps.version.outputs.PHROLOVA_TAG }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          KSU_VERSION: ${{ steps.ksu.outputs.KSU_VERSION_NUM }}
          KSU_TAG: ${{ steps.ksu.outputs.KSU_TAG }}
        continue-on-error: true

      - name: Cache Greenforce Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: greenforce-clang
          key: greenforce-clang-24.0.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex \
            libssl-dev libelf-dev zstd \
            python3 \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            zip
          if [ "${{ steps.cache-clang.outputs.cache-hit }}" != "true" ]; then
            wget -qO- https://raw.githubusercontent.com/greenforce-project/greenforce_clang/refs/heads/main/get_clang.sh | bash
          fi
          echo "$(pwd)/greenforce-clang/bin" >> $GITHUB_PATH

      - name: Setup KernelSU symlink
        run: |
          ln -sf "$(realpath resukisu/kernel)" drivers/kernelsu
          test -L drivers/kernelsu && echo "Symlink OK" || { echo "Symlink failed"; exit 1; }

      - name: Build kernel (selene_defconfig)
        id: build
        env:
          KBUILD_BUILD_USER: "Phrolova🎻"
          KBUILD_BUILD_HOST: "selene"
        run: |
          set +e
          make O=out ARCH=arm64 \
            CC=clang HOSTCC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            selene_defconfig 2>&1 | tee build.log
          make O=out ARCH=arm64 \
            CC=clang HOSTCC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc) 2>&1 | tee -a build.log
          MAKE_EXIT=${PIPESTATUS[0]}
          echo "MAKE_EXIT_CODE=${MAKE_EXIT}" >> $GITHUB_ENV
          exit $MAKE_EXIT

      - name: Verify critical configs (anti-silent-drop gate)
        run: |
          miss=0
          for sym in \
            CONFIG_USER_NS CONFIG_IPC_NS CONFIG_CGROUP_PIDS \
            CONFIG_POSIX_MQUEUE CONFIG_VETH CONFIG_OVERLAY_FS \
            CONFIG_DEFAULT_BBR CONFIG_TCP_CONG_BBR \
            CONFIG_KSU CONFIG_KSU_MANUAL_HOOK CONFIG_NOMOUNT \
            CONFIG_DEFAULT_BFQ; do
            grep -q "^${sym}=y" out/.config || {
              echo "::error::Config hilang dari .config: ${sym}"
              miss=1
            }
          done
          grep -q 'CONFIG_DEFAULT_IOSCHED="bfq"' out/.config || {
            echo "::error::DEFAULT_IOSCHED bukan bfq"
            miss=1
          }
          grep -q '^# CONFIG_TCP_CONG_BIC is not set' out/.config || {
            echo "::error::TCP_CONG_BIC masih aktif — vendor Kconfig.select bocor!"
            miss=1
          }
          exit $miss

      - name: Upload .config (debug artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config
          path: out/.config

      - name: Package AnyKernel3
        if: success() && (hashFiles('out/arch/arm64/boot/Image*') != '')
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 ak3 || { echo "::error::AnyKernel3 clone failed"; exit 1; }
          cd ak3 && git checkout dca9dc3 && cd ..
          cp scripts/anykernel.sh ak3/anykernel.sh
          cp reference/banner ak3/banner 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb ak3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image.gz ak3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image ak3/
          cd ak3 && zip -r9 ../Phrolova-selene-${{ steps.version.outputs.PHROLOVA_TAG }}.zip . -x .git/\*

      - name: Upload artifact
        if: success() && steps.final-check.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Phrolova-selene
          path: Phrolova-selene-*.zip

      - name: Final check
        id: final-check
        if: always()
        run: |
          HAS_ERROR=0
          if [ -f build.log ] && grep -qiE "(\.c:[0-9]+:.*error:|clang: error:|error:.*failed)" build.log 2>/dev/null; then
            echo "::error::Compilation error found"
            HAS_ERROR=1
          fi
          if [ "${MAKE_EXIT_CODE:-0}" -ne 0 ]; then
            echo "::error::make exited with code ${MAKE_EXIT_CODE}"
            HAS_ERROR=1
          fi
          if [ ! -f out/arch/arm64/boot/Image.gz ] && [ ! -f out/arch/arm64/boot/Image ] && [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "::error::No kernel image found"
            HAS_ERROR=1
          fi
          echo "status=$([ "$HAS_ERROR" -eq 1 ] && echo "failed" || echo "success")" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        if: steps.final-check.outputs.status == 'success'
        run: |
          bash .github/scripts/generate-changelog.sh \
            "${{ steps.version.outputs.PHROLOVA_VERSION }}" \
            "${{ steps.version.outputs.PHROLOVA_TAG }}" \
            "${{ env.PHROLOVA_VARIANT }}" > changelog.md

      - name: Prepare release body
        if: steps.final-check.outputs.status == 'success'
        run: bash .github/scripts/append-root-section.sh

      - name: Build NoMount userspace (nm)
        if: steps.final-check.outputs.status == 'success'
        run: |
          aarch64-linux-gnu-gcc -static -O2 -nostdlib -nostartfiles \
            -I${GITHUB_WORKSPACE}/tools/nomount \
            -o nm \
            ${GITHUB_WORKSPACE}/tools/nomount/nm.c
          file nm

      - name: Create GitHub Release
        if: steps.final-check.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.PHROLOVA_TAG }}
          name: Phrolova ${{ steps.version.outputs.PHROLOVA_VERSION }}
          body_path: release_body.md
          files: |
            Phrolova-selene-${{ steps.version.outputs.PHROLOVA_TAG }}.zip
            nm
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Notify result
        if: always()
        run: |
          STATUS="${{ steps.final-check.outputs.status }}"
          if [ "$STATUS" = "success" ]; then
            bash .github/scripts/notify-telegram.sh \
              success \
              "${{ steps.version.outputs.PHROLOVA_VERSION }}" \
              "${{ steps.version.outputs.PHROLOVA_TAG }}" \
              "changelog.md"
          else
            bash .github/scripts/notify-telegram.sh \
              failed \
              "${{ steps.version.outputs.PHROLOVA_VERSION }}" \
              "${{ steps.version.outputs.PHROLOVA_TAG }}" \
              "build.log"
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ERROR_CHANNEL_ID: ${{ secrets.TELEGRAM_ERROR_CHANNEL_ID }}
          KSU_VERSION: ${{ steps.ksu.outputs.KSU_VERSION_NUM }}
          KSU_TAG: ${{ steps.ksu.outputs.KSU_TAG }}
